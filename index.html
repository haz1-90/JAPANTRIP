<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C447C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06284a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Travel companion for the KNM Japan trip, 8–15 Nov 2026.">
<!-- iOS PWA / Add to Home Screen -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KNM Japan">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>KNM Japan 2026</title>
<style>
:root{
  --navy:#0C447C; --navy2:#1D63AB; --navylite:#B5D4F4;
  --brand1:#0C447C; --brand2:#093766;
  --green:#0F6E56; --greenbg:#E1F5EE;
  --red:#B02A2A; --redbg:#FBEAEA;
  --amber:#8A5209; --amberbg:#FAEEDA;
  --ink:#1b1c1e; --muted:#6b6a64; --hint:#9a9890;
  --bg:#f5f3ee; --card:#ffffff; --line:#e6e3da; --soft:#f0eee7;
  --accent-soft:#E6F1FB;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06);
  --shadow-lg:0 8px 34px rgba(16,24,40,.16);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --navh:calc(58px + var(--safe-b));
}
@media (prefers-color-scheme: dark){
  :root{
    --navy:#5FA0E6; --navy2:#6EA9E6; --navylite:#9cc6f2;
    --brand1:#0C447C; --brand2:#06284a;
    --green:#4ecfa6; --greenbg:#12332a;
    --red:#f0857f; --redbg:#3a1f20;
    --amber:#e0aa5c; --amberbg:#3a2e1b;
    --ink:#e7e8ea; --muted:#a4a8ae; --hint:#7d828a;
    --bg:#0e1013; --card:#191c20; --line:#2a2e34; --soft:#22262c;
    --accent-soft:#152a41;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    --shadow-lg:0 10px 40px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{ -webkit-text-size-adjust:100%; }
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
body{padding-bottom:var(--navh);max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;
  overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
.hidden{display:none!important;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px;border-radius:6px;}

/* Header */
header{position:sticky;top:0;z-index:50;color:#fff;
  padding:calc(12px + var(--safe-t)) 16px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(135deg,var(--brand1),var(--brand2));
  box-shadow:0 2px 14px rgba(9,40,74,.28);}
header .title{font-size:16px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px;}
header .title .logo{width:24px;height:24px;border-radius:7px;flex:0 0 24px;
  background:linear-gradient(135deg,#2b7de0,#0C447C);border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.admin-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.18);color:#fff;padding:7px 13px;border-radius:22px;font-size:13px;
  font-weight:600;cursor:pointer;transition:transform .12s ease,background .2s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.admin-btn:active{transform:scale(.95);}
.admin-btn.on{background:#12b886;border-color:rgba(255,255,255,.35);color:#fff;box-shadow:0 0 0 3px rgba(18,184,134,.2);}

/* status bar */
.statusbar{position:sticky;top:0;background:color-mix(in srgb,var(--card) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(10px);backdrop-filter:saturate(180%) blur(10px);
  padding:8px 16px;font-size:12px;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:40;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;}
.dot.ok{background:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,.18);}
.dot.off{background:#d84a44;box-shadow:0 0 0 3px rgba(216,74,68,.18);}
.dot.load{background:#e0a800;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.refresh-btn{background:none;border:none;color:var(--navy2);font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;transition:background .2s;}
.refresh-btn:active{background:var(--soft);}

/* screens */
main{padding:14px 14px 22px;}
.screen{display:none;} .screen.active{display:block;animation:fade .24s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.eyebrow{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.8px;margin:2px 0 12px;font-weight:700;}
.sect-label{font-size:12px;color:var(--muted);font-weight:700;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px;}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:11px;
  box-shadow:var(--shadow);transition:transform .12s ease;}
.card.tap{cursor:pointer;} .card.tap:active{transform:scale(.99);}

/* next stop */
.nextcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;}
.nextcard::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--navy2),#12b886);}
.nextcard .loc{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;line-height:1.25;}
.nextcard .loc i{flex:0 0 auto;font-size:22px;}
.nextcard .time{font-size:38px;font-weight:800;margin:10px 0 2px;letter-spacing:-1.5px;line-height:1;}
/* Dua perhentian sekali pandang: SEKARANG (besar, bergaris hijau) dan
   SELEPAS INI (lebih kecil, kelabu). Beza saiz & warna yang buat orang tua
   nampak mana satu sedang berlaku tanpa perlu baca satu-satu. */
.stop-label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;
  letter-spacing:.6px;margin:0 0 8px;}
.stop-label.now{color:var(--green);}
.stop-label.then{color:var(--muted);margin-top:18px;}
.stop-label .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(18,184,134,.55);animation:nowPulse 2s infinite;}
@keyframes nowPulse{70%{box-shadow:0 0 0 9px rgba(18,184,134,0);}100%{box-shadow:0 0 0 0 rgba(18,184,134,0);}}
.upnext{background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:14px 15px;}
.upnext.done{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;}
.upnext.done i{font-size:20px;color:var(--green);flex:0 0 auto;}
.un-head{display:flex;align-items:baseline;gap:9px;}
.un-head i{font-size:19px;flex:0 0 auto;position:relative;top:2px;}
.un-loc{font-size:16.5px;font-weight:700;flex:1;min-width:0;line-height:1.3;}
.un-time{font-size:19px;font-weight:800;letter-spacing:-.5px;flex:0 0 auto;color:var(--navy2);}
.un-act{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4;}
/* popup selepas Mark done */
.moved-done{display:flex;align-items:center;gap:11px;background:var(--greenbg);color:var(--green);
  border-radius:13px;padding:13px 15px;font-size:16px;}
.moved-done i{font-size:26px;flex:0 0 auto;}
.moved-done .ms{font-size:12.5px;font-weight:600;opacity:.85;}
.moved-label{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--navy);margin:16px 0 8px;}
.moved-next{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:15px;}
.mn-loc{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;line-height:1.3;}
.mn-loc i{font-size:21px;flex:0 0 auto;}
.mn-time{font-size:30px;font-weight:800;letter-spacing:-1px;margin:8px 0 2px;line-height:1;}
.mn-act{font-size:14.5px;color:var(--muted);line-height:1.45;}
.pill{display:inline-block;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600;}
.pill.warn{background:var(--amberbg);color:var(--amber);}
.pill.urgent{background:var(--redbg);color:var(--red);}
.pill.ok{background:var(--greenbg);color:var(--green);}
.pill.late{background:var(--redbg);color:var(--red);}
.pill.early{background:var(--accent-soft);color:var(--navy);}

.qbtns{display:flex;gap:8px;margin-top:14px;}
.qbtn{flex:1;text-align:center;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:10px 4px;
  cursor:pointer;transition:transform .12s ease,background .2s;}
.qbtn:active{transform:scale(.96);background:var(--line);}
.qbtn i{font-size:18px;} .qbtn div{font-size:11px;margin-top:3px;color:var(--muted);font-weight:600;}

.bigbtn{width:100%;margin-top:12px;background:linear-gradient(135deg,#12915f,var(--green));color:#fff;border:none;
  border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(15,110,86,.25);
  transition:transform .12s ease,filter .2s;}
.bigbtn:active{transform:scale(.985);filter:brightness(.96);}
.bigbtn.grey{background:var(--soft);color:var(--muted);border:1px solid var(--line);box-shadow:none;}

.rem-item{display:flex;align-items:center;gap:10px;background:var(--redbg);border-radius:11px;padding:11px 12px;margin-top:8px;
  border:1px solid color-mix(in srgb,var(--red) 22%,transparent);}
.rem-item i{color:var(--red);font-size:17px;flex-shrink:0;}
.rem-item span{font-size:13px;color:var(--red);font-weight:500;}
.rem-item.soft{background:var(--amberbg);border-color:color-mix(in srgb,var(--amber) 22%,transparent);}
.rem-item.soft i,.rem-item.soft span{color:var(--amber);}

/* day tabs */
.daytabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;}
.daytabs::-webkit-scrollbar{display:none;}
.daytab{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);font-size:13px;
  padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0;font-weight:600;line-height:1.25;
  transition:transform .12s ease;}
.daytab:active{transform:scale(.96);}
.daytab.on{background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#fff;border-color:transparent;
  box-shadow:0 3px 10px rgba(9,40,74,.25);}

/* timeline */
.tl{border-left:2px solid var(--line);padding-left:16px;margin-left:5px;}
.tl-item{position:relative;margin-bottom:15px;}
.tl-item::before{content:'';position:absolute;left:-23px;top:4px;width:11px;height:11px;border-radius:50%;
  background:var(--navy2);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);}
.tl-item.prayer::before{background:var(--green);}
.tl-item.done::before{background:#B4B2A9;}
.tl-item.done .tl-act{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--hint);}
.tl-time{font-size:12px;color:var(--hint);font-weight:600;}
.tl-act{font-size:14px;font-weight:600;margin-top:2px;}
.tl-loc{font-size:12px;color:var(--muted);}
.transit{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--navy);
  font-size:11px;padding:4px 10px;border-radius:8px;margin-top:6px;font-weight:600;}
/* Maklumat kereta api = benda paling kritikal untuk dibaca berdiri di platform.
   Versi besar: bungkus penuh, tak dipotong, saiz boleh dibaca tanpa cermin mata. */
.transit.big{display:flex;font-size:14px;line-height:1.45;padding:9px 12px;margin-top:9px;
  border-radius:10px;align-items:flex-start;white-space:normal;}
.transit.big i{font-size:17px;flex:0 0 auto;margin-top:1px;}
.tl-notes{font-size:11px;color:var(--hint);margin-top:5px;font-style:italic;}
.tl-price{display:inline-block;font-size:12px;font-weight:700;color:var(--ink);margin-top:4px;}
.tl-actions{display:flex;gap:7px;margin-top:9px;}
.mini{flex:1;text-align:center;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px;
  cursor:pointer;color:var(--ink);transition:transform .12s ease,background .2s;}
.mini:active{transform:scale(.95);background:var(--line);}
.mini i{font-size:15px;}
.tag-done{font-size:10px;color:var(--green);margin-left:6px;font-weight:700;}

/* parking */
.pk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pk-name{font-size:14px;font-weight:700;}
.pk-sub{font-size:13px;margin-top:6px;color:var(--muted);}
.pk-warn{font-size:11px;color:var(--amber);margin-top:4px;font-weight:500;}
.pk-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px;}
.pk-price{font-size:15px;font-weight:700;}

/* stay */
.stay-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.stay-name{font-size:14px;font-weight:700;}
.stay-date{font-size:11px;color:var(--hint);font-weight:600;background:var(--soft);padding:3px 9px;border-radius:20px;flex-shrink:0;}
.stay-addr{font-size:12px;color:var(--muted);margin-top:7px;}
.stay-meta{display:flex;gap:18px;margin-top:10px;}
.stay-meta .lbl{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.4px;}
.stay-meta .val{font-size:13px;font-weight:700;margin-top:1px;}

/* metric */
.metrics{display:flex;gap:10px;margin-bottom:14px;}
.metric{flex:1;background:linear-gradient(135deg,var(--card),var(--soft));border:1px solid var(--line);
  border-radius:13px;padding:13px;box-shadow:var(--shadow);}
.metric .lbl{font-size:11px;color:var(--muted);font-weight:600;} .metric .num{font-size:21px;font-weight:800;margin-top:3px;letter-spacing:-.5px;}
.link-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .12s ease;}
.link-row:active{transform:scale(.99);}
.link-row i:first-child{font-size:19px;} .link-row span{font-size:13px;flex:1;font-weight:600;}

/* budget rows */
.brow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.brow.sub{font-weight:700;background:var(--soft);padding:9px 11px;border-radius:9px;border:none;margin-top:8px;}
.brow.grand{font-weight:800;color:var(--navy);font-size:16px;border:none;margin-top:10px;}
.binfo{font-size:12px;color:var(--muted);}

/* info rows */
.irow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
.irow .k{color:var(--muted);flex-shrink:0;} .irow .v{text-align:right;font-weight:600;}

/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
  background:color-mix(in srgb,var(--card) 85%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:var(--safe-b);}
.navbtn{flex:1;text-align:center;padding:9px 0 8px;border:none;background:none;cursor:pointer;
  position:relative;transition:transform .12s ease;}
.navbtn:active{transform:scale(.9);}
.navbtn i{font-size:21px;color:var(--hint);transition:color .2s;} .navbtn div{font-size:10px;color:var(--hint);margin-top:2px;font-weight:600;transition:color .2s;}
.navbtn.on i,.navbtn.on div{color:var(--navy);}
.navbtn.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--navy2);}

/* modal — bottom sheet on mobile */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;
  justify-content:center;max-width:520px;margin:0 auto;animation:ovl .2s ease;}
@keyframes ovl{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:22px 20px calc(20px + var(--safe-b));width:100%;
  box-shadow:var(--shadow-lg);animation:sheet .28s cubic-bezier(.16,1,.3,1);position:relative;}
.modal::before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:40px;height:4px;border-radius:3px;background:var(--line);}
@keyframes sheet{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal h3{margin:6px 0 4px;font-size:18px;font-weight:700;} .modal p{margin:0 0 14px;font-size:13px;color:var(--muted);}
.modal input,.modal select,.modal textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;
  font-size:16px;margin-bottom:10px;font-family:inherit;background:var(--soft);color:var(--ink);}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none;border-color:var(--navy2);
  box-shadow:0 0 0 3px rgba(29,99,171,.15);background:var(--card);}
.modal-row{display:flex;gap:9px;margin-top:4px;}
.mbtn{flex:1;padding:13px;border-radius:11px;border:none;font-size:15px;font-weight:700;cursor:pointer;
  transition:transform .12s ease,filter .2s;}
.mbtn:active{transform:scale(.98);}
.mbtn.primary{background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#fff;}
.mbtn.ghost{background:var(--soft);color:var(--muted);border:1px solid var(--line);}
.mbtn.danger{background:var(--red);color:#fff;}
.err{color:var(--red);font-size:12px;margin-bottom:8px;font-weight:600;}
.field-label{font-size:11px;color:var(--muted);margin-bottom:3px;display:block;font-weight:600;}

.empty{text-align:center;color:var(--hint);font-size:13px;padding:34px 10px;}
.toast{position:fixed;bottom:calc(var(--navh) + 14px);left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;
  z-index:200;opacity:0;transition:opacity .3s,transform .3s;max-width:90%;box-shadow:var(--shadow-lg);pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--navy2);
  border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* skeleton loading */
.skel{border-radius:12px;background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);
  background-size:200% 100%;animation:shimmer 1.3s infinite;}
@keyframes shimmer{to{background-position:-200% 0;}}
.skel-card{height:150px;margin-bottom:12px;}
.skel-line{height:14px;margin:8px 0;}

/* live pacing */
.pacebar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 12px;}
.pacebar .plbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:3px;gap:2px;}
.seg button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);
  padding:6px 13px;border-radius:20px;cursor:pointer;transition:transform .12s ease;}
.seg button:active{transform:scale(.95);}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:var(--shadow);}
.pacebox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:11px;box-shadow:var(--shadow);}
.pacebox .ph{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:9px;}
.pacerow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);}
.pacerow:last-child{border-bottom:none;}
.pacerow .pl{color:var(--ink);}
.pacerow .pr{color:var(--muted);font-weight:600;white-space:nowrap;}
.pacerow.anchor .pl{font-weight:700;}

<script>
// Papar skrin kunci SERTA-MERTA semasa HTML dihurai — tidak menunggu
// DOMContentLoaded, CSS luar, atau data. Gaya .lock sudah sedia dalam <head>.
// Juga kunci kalau app ditinggalkan lebih 6 jam — dikira di sini supaya skrin
// kunci tak berkelip masuk lambat selepas skrin utama sempat terpapar.
try{
  var _stale=(Number(localStorage.getItem("knm_last_seen"))||0)>0 &&
             (Date.now()-Number(localStorage.getItem("knm_last_seen")))>6*60*60*1000;
  if(_stale){try{localStorage.removeItem("knm_me");localStorage.removeItem("knm_me_pin");}catch(e){}}
  if(!localStorage.getItem("knm_me")){
    var _ls=document.getElementById("lockScreen");
    if(_ls){_ls.classList.remove("hidden");document.body.style.overflow="hidden";}
  }
}catch(e){}
</script>

<script>
// ====== CONFIG ======
const API_URL = "https://script.google.com/macros/s/AKfycbyMe6XMnw70-o168BL4IRPRWrZnKRjFIoyIA9Bpjn9cf29T6EKMiRGDVnhC9Z6xtoApXw/exec";
const CACHE_KEY = "knm_japan_cache_v1";
const TRIP_TZ_LABEL = "JST";

let DATA = {};       // {tab: [[headers],[row]...]}
let CFG = {};        // {expensesOpen:bool} — server yang tentukan, bukan app
let ADMIN = false;
let ADMIN_PIN = "";
let curDay = null;

// ====== UTIL ======
const $ = s => document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// For values inside onclick="fn('...')": entities decode BEFORE the JS parses,
// so quotes must also be backslash-escaped at the JS layer or they break the call.
function jsq(s){return esc(String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r?\n/g," "));}
function rows(tab){const d=DATA[tab];if(!d||d.length<2)return[];const h=d[0];return d.slice(1).map((r,i)=>{const o={_row:i+2};h.forEach((k,j)=>o[k]=r[j]);return o;});}
function headers(tab){return (DATA[tab]&&DATA[tab][0])||[];}
// encodeURIComponent leaves ' unescaped, which breaks onclick='openLink()' strings — force %27
function uenc(s){return encodeURIComponent(String(s==null?"":s)).replace(/'/g,"%27");}
function mapsSearch(q){return "https://www.google.com/maps/search/?api=1&query="+uenc(q);}
function mapsDir(lat,lng,name){if(lat&&lng)return "https://www.google.com/maps/dir/?api=1&destination="+lat+","+lng;return mapsSearch(name||"");}
function openLink(u){window.open(u,"_blank");}

// ====== DATA LOAD (hybrid cache) ======
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));if(c&&c.data){DATA=c.data;CFG=c.cfg||{};return c.ts;}}catch(e){}return null;}
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),data:DATA,cfg:CFG}));}catch(e){}}

async function refresh(manual){
  setSync("load","Syncing…");
  // Apps Script kadang lambat bangun (cold start) atau data mudah alih tersekat
  // sekejap. Dulu satu kegagalan terus papar "Offline" walaupun internet ada —
  // sekarang cuba dua kali, dan bezakan tiada internet vs server tak jawab.
  const attempt=async(ms)=>{
    const ac=("AbortController" in window)?new AbortController():null;
    const t=ac?setTimeout(()=>ac.abort(),ms):null;
    try{
      const r=await fetch(API_URL+"?t="+Date.now(),{method:"GET",signal:ac?ac.signal:undefined});
      if(t)clearTimeout(t);
      return await r.json();
    }catch(e){ if(t)clearTimeout(t); throw e; }
  };
  let j=null,lastErr=null;
  for(let i=0;i<2;i++){
    try{ j=await attempt(i===0?12000:20000); break; }
    catch(e){ lastErr=e; if(i===0){setSync("load","Syncing… retrying");await new Promise(r=>setTimeout(r,1200));} }
  }
  if(j&&j.ok){
    DATA=j.data;CFG=j.cfg||{};saveCache();
    setSync("ok","Synced "+timeNow());renderAll();lockReconcile();
    if(manual)toast("Up to date");
    return;
  }
  const offline=("onLine" in navigator)&&!navigator.onLine;
  const msg = offline ? "No internet — showing saved"
            : (j&&j.error) ? "Server error — showing saved"
            : "Can't reach server — showing saved";
  setSync("off",msg);
  if(manual)toast(offline?"No internet connection":"Server did not respond — showing saved copy");
}

// ====== WRITE (via Apps Script) ======
async function apiPost(payload,pinOverride,timeoutMs){
  try{
    payload.pin=pinOverride||ADMIN_PIN;
    // Apps Script boleh ambil masa; had masa supaya app tak tergantung senyap.
    const ac=("AbortController" in window)?new AbortController():null;
    const t=ac?setTimeout(()=>ac.abort(),timeoutMs||20000):null;
    const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(payload),signal:ac?ac.signal:undefined});
    if(t)clearTimeout(t);
    return await r.json();
  }catch(e){
    const aborted=e&&e.name==="AbortError";
    // netfail = server tak dapat dihubungi (bukan PIN salah). Skrin kunci guna
    // penanda ni untuk tukar ke pengesahan tempatan bila tiada internet.
    return {ok:false,netfail:true,
            error:aborted?"Took too long — check your connection and try again."
                         :"Offline — the change was not sent. Please try again when connected."};
  }
}

<script>

// ====== TODAY ======
function parseTimeToMin(t){
  if(!t)return null;const m=String(t).match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(!m)return null;let h=+m[1],min=+m[2];const ap=(m[3]||"").toUpperCase();
  if(ap==="PM"&&h<12)h+=12;if(ap==="AM"&&h===12)h=0;return h*60+min;
}

// ====== LIVE PACING ======
// Fixed points (trains, prayer, flights) = itinerary rows tagged urgent=YES with a
// real clock time. Between fixed points, stops are flexible: their suggested time
// auto-shrinks when you run late and grows when you're early. Advisory only — never
// writes to the Sheet. Controls are admin-only; the info shows to everyone on the trip.
const PACE_KEY="knm_pace_v1";
function paceMode(){try{return localStorage.getItem(PACE_KEY)||"schedule";}catch(e){return "schedule";}}
function setPaceMode(m){try{localStorage.setItem(PACE_KEY,m);}catch(e){}renderAll();}
// Semua logik masa guna waktu Jepun (JST), bukan jam telefon. Kalau ikut jam
// telefon, test dari KL tersasar 1 jam, dan kita bergantung pada setiap telefon
// betul-betul auto-tukar zon bila mendarat.
function tzNow(zone,offsetHours){
  try{
    const f=new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',
      month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    const p={};f.formatToParts(new Date()).forEach(x=>{p[x.type]=x.value;});
    return {y:+p.year,mo:+p.month-1,d:+p.day,h:+p.hour%24,mi:+p.minute};
  }catch(e){ // Intl tiada sokongan zon: guna offset tetap
    const t=new Date(Date.now()+offsetHours*3600000);
    return {y:t.getUTCFullYear(),mo:t.getUTCMonth(),d:t.getUTCDate(),h:t.getUTCHours(),mi:t.getUTCMinutes()};
  }
}
function jstNow(){return tzNow('Asia/Tokyo',9);}
function mytNow(){return tzNow('Asia/Kuala_Lumpur',8);}
function hhmm(n){return String(n.h).padStart(2,"0")+":"+String(n.mi).padStart(2,"0");}
function nowMin(){const n=jstNow();return n.h*60+n.mi;}
// Hari 1 bermula di KLIA2 (waktu Malaysia) tetapi berakhir di Haneda (waktu
// Jepun). Kalau dua-dua dibaca sebagai nombor mentah, jurang KUL 2:50 PM ->
// HND 10:40 PM jadi 7j50m sedangkan penerbangan sebenarnya 6j50m.
// Jadi SEMUA kiraan dalaman ditukar ke JST; teks yang dipapar kekal seperti
// ditulis dalam Sheet ("2:50 PM MYT").
const MY_ROW=/\bMYT\b|KLIA|Kuala Lumpur|\bKUL\b|Sepang/i;
function isMyRow(r){return MY_ROW.test(String((r&&r.time)||"")+" "+String((r&&r.location)||""));}
// Minit-dalam-hari untuk satu baris, sentiasa dalam JST.
function rowMin(r){
  const t=parseTimeToMin(r&&r.time);
  return t==null?null:t+(isMyRow(r)?60:0);
}
// "Sekarang" dalam zon baris itu — untuk waktu solat, yang ikut lokasi.
function nowMinAt(r){const n=isMyRow(r)?mytNow():jstNow();return n.h*60+n.mi;}
// Trip window is read from Info (key "Dates", e.g. "8-15 November 2026 (7 nights)")
// so shifting the trip only needs a Sheet edit; falls back to 8-15 Nov 2026.
function tripWindow(){
  const inf=rows("Info").find(r=>/^dates?$/i.test(String(r.key).trim()));
  const m=String((inf&&inf.value)||"").match(/(\d{1,2})\s*[-–]\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  if(m){
    const MON={jan:0,feb:1,mar:2,mac:2,apr:3,may:4,mei:4,jun:5,jul:6,aug:7,ogo:7,sep:8,oct:9,okt:9,nov:10,dec:11,dis:11};
    const mo=MON[m[3].slice(0,3).toLowerCase()];
    if(mo!=null)return {d1:+m[1],d2:+m[2],mo:mo,yr:+m[4]};
  }
  return {d1:8,d2:15,mo:10,yr:2026};
}
function tripActive(){
  const d=jstNow(),w=tripWindow();
  const inWin=(d.y===w.yr&&d.mo===w.mo&&d.d>=w.d1&&d.d<=w.d2);
  const started=rows("Itinerary").some(r=>String(r.status).toLowerCase()==="done");
  return inWin||started;
}
function fmtMin(m){m=((Math.round(m)%1440)+1440)%1440;let h=Math.floor(m/60),mm=m%60,ap=h<12?"AM":"PM",hh=h%12;if(hh===0)hh=12;return hh+":"+String(mm).padStart(2,"0")+" "+ap;}
function fmtDur(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),mm=m%60;if(h&&mm)return h+"h "+mm+"m";if(h)return h+"h";return mm+"m";}
// Sheet simpan "8 Nov" sahaja — tiada nama hari. Kira dari tahun trip supaya
// "Fri 13 Nov" jelas (penting: Solat Jumaat & pulangkan kereta hari Sabtu).
const MON3={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const DAYS3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYSFULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function weekdayOf(dateStr,full){
  const m=String(dateStr||"").match(/(\d{1,2})\s*([A-Za-z]{3})/);
  if(!m)return "";
  const mo=MON3[m[2].toLowerCase()];
  if(mo==null)return "";
  const d=new Date(Date.UTC(tripWindow().yr,mo,+m[1]));
  return (full?DAYSFULL:DAYS3)[d.getUTCDay()];
}
function dayList(day){return rows("Itinerary").filter(r=>String(r.day)===String(day));}
function nextAnchor(list,fromIdx){
  for(let i=fromIdx;i<list.length;i++){
    const r=list[i],t=rowMin(r);
    if(String(r.urgent).toUpperCase()==="YES"&&t!=null&&String(r.status).toLowerCase()!=="done")return {r:r,t:t,i:i};
  }
  return null;
}
function pacePill(next){
  if(!ADMIN||!tripActive())return "";
  const s=rowMin(next);if(s==null)return "";
  const diff=nowMin()-s; // + = behind (dua-dua dalam JST)
  if(Math.abs(diff)<=5)return '<span class="pill ok">On schedule</span>';
  if(diff>5)return '<span class="pill late">Behind '+fmtDur(diff)+'</span>';
  return '<span class="pill early">Ahead '+fmtDur(-diff)+'</span>';
}
function paceToggle(){
  if(!ADMIN||!tripActive())return "";
  const m=paceMode();
  return `<div class="pacebar">
    <span class="plbl">Pacing</span>
    <span class="seg">
      <button class="${m==='schedule'?'on':''}" onclick="setPaceMode('schedule')">Follow schedule</button>
      <button class="${m==='flex'?'on':''}" onclick="setPaceMode('flex')">Take your time</button>
    </span>
  </div>`;
}
function paceBlock(next){
  if(!ADMIN||!tripActive())return "";
  const list=dayList(next.day);
  const idx=list.findIndex(r=>String(r.id)===String(next.id));
  if(idx<0)return "";
  const anc=nextAnchor(list,idx);
  if(!anc)return ""; // no fixed point left today → nothing to pace against
  if(anc.i===idx){
    return `<div class="pacebox"><div class="ph">Fixed point</div>
      <div class="pacerow anchor"><span class="pl">${esc(next.activity)}</span><span class="pr">be here · ${esc(next.time)}</span></div></div>`;
  }
  const now=nowMin(),mode=paceMode();
  const flex=[];
  for(let i=idx;i<anc.i;i++){
    const r=list[i];
    if(String(r.status).toLowerCase()==="done")continue;
    if(String(r.urgent).toUpperCase()==="YES")continue;
    flex.push(r);
  }
  const avail=anc.t-now;
  let html=`<div class="pacebox"><div class="ph">${mode==="flex"?"Take your time":"Follow schedule"} → ${esc(anc.r.activity)} · ${esc(anc.r.time)}</div>`;
  html+=`<div class="pacerow"><span class="pl">Time to fixed point</span><span class="pr">${avail<0?'<span style="color:var(--red)">'+fmtDur(-avail)+' over</span>':fmtDur(avail)+' left'}</span></div>`;
  if(mode==="flex"&&flex.length){
    let cursor=now;const per=Math.max(0,avail/flex.length);
    flex.forEach(r=>{
      const leave=cursor+per;
      html+=`<div class="pacerow ${per<10?'tight':''}"><span class="pl">${esc(r.activity)}</span><span class="pr">${fmtMin(cursor)}–${fmtMin(leave)} · ${fmtDur(per)}</span></div>`;
      cursor=leave;
    });
  }else{
    flex.forEach(r=>{
      const t=rowMin(r);
      html+=`<div class="pacerow"><span class="pl">${esc(r.activity)}</span><span class="pr">${t!=null?esc(r.time):"flexible"}</span></div>`;
    });
  }
  html+=`<div class="pacerow anchor"><span class="pl">${esc(anc.r.activity)}</span><span class="pr">${esc(anc.r.time)} · fixed</span></div>`;
  html+=`</div>`;
  return html;
}
// Cascade suggested times across a whole day (multiple fixed points). Returns
// {id: {done}|{anchor,t}|{arr,leave,per,tight}|{sched}} for the Trip timeline.
function dayPace(day){
  const list=dayList(day),res={};
  let i=0,cursor=nowMin();
  while(i<list.length){
    const r=list[i];
    const done=String(r.status).toLowerCase()==="done";
    const t=rowMin(r);
    const isAnchor=String(r.urgent).toUpperCase()==="YES"&&t!=null&&!done;
    if(done){res[r.id]={done:true};i++;continue;}
    if(isAnchor){cursor=Math.max(cursor,t);res[r.id]={anchor:true,t:t};i++;continue;}
    // flexible segment: gather until the next fixed point
    let j=i;const seg=[];
    while(j<list.length){
      const rj=list[j],dj=String(rj.status).toLowerCase()==="done",tj=rowMin(rj);
      const aj=String(rj.urgent).toUpperCase()==="YES"&&tj!=null&&!dj;
      if(aj)break;
      if(!dj)seg.push(rj);
      j++;
    }
    const anchorT=(j<list.length)?rowMin(list[j]):null;
    if(anchorT!=null&&seg.length){
      const per=Math.max(0,(anchorT-cursor)/seg.length);
      seg.forEach(s=>{res[s.id]={arr:cursor,leave:cursor+per,per:per,tight:per<10};cursor+=per;});
    }else{
      seg.forEach(s=>{res[s.id]={sched:true};});
    }
    i=j;
  }
  return res;
}

// Baki perhentian yang belum ditanda selesai, ikut susunan Sheet.
// [0] = tempat kita SEKARANG, [1] = tempat SETERUSNYA.
function pendingStops(){
  return rows("Itinerary").filter(r=>String(r.status).toLowerCase()!=="done");
}
function renderToday(){
  const it=rows("Itinerary");
  if(!it.length){$("#todayBody").innerHTML='<div class="empty">No itinerary yet.</div>';return;}
  const todays=pendingStops();
  const next=todays[0]||it[it.length-1];      // sekarang
  const after=todays[1]||null;                // selepas ini
  const ico=TYPE_ICON[next.type]||"ti-map-pin",col=TYPE_COLOR[next.type]||"#185FA5";
  const nmode=stopMode(next),nmeta=MODE_META[nmode];
  const dayNum=next.day;
  let remHtml="";
  const dayRem=it.filter(r=>String(r.day)===String(dayNum)&&String(r.urgent).toUpperCase()==="YES"&&String(r.status).toLowerCase()!=="done");
  dayRem.slice(0,3).forEach(r=>{
    remHtml+=`<div class="rem-item"><i class="ti ti-alarm"></i><span>${esc(r.time)} · ${esc(r.activity)}</span></div>`;
  });
  if(!remHtml)remHtml='<div class="rem-item soft"><i class="ti ti-info-circle"></i><span>No urgent items right now</span></div>';

  const notes=next.notes?`<div class="tl-notes">${esc(next.notes)}</div>`:"";
  const doneBtn=ADMIN?`<button class="bigbtn" onclick="markDone('${jsq(next.id)}')"><i class="ti ti-check"></i>Done here · go to next</button>`:"";
  const pill=pacePill(next);
  const upnext=upNextCard(after);

  const jn=jstNow(),mn=mytNow();
  const meNow=meGet()||WHO_NAME;
  // Butang kunci sentiasa ada bila dah masuk \u2014 supaya boleh tukar orang tanpa
  // kena bukak incognito atau clear browser data.
  const hi=meNow
    ?`<div class="greet-row"><div class="greet">Hi ${esc(meNow)} <span style="font-weight:400">\u{1F44B}</span></div>
        <button class="lockbtn" onclick="lockNow()" aria-label="Lock and switch user"><i class="ti ti-lock"></i>Lock</button></div>`
    :`<div class="greet" style="cursor:pointer" onclick="showLock()">Hi there <span style="font-size:12px;color:var(--navy2);font-weight:600">\u00b7 sign in</span></div>`;
  const clocks=`<div class="clocks">
      <div class="clk"><div class="cl">Japan · JST</div><div class="ct">${hhmm(jn)}</div></div>
      <div class="clk"><div class="cl">Malaysia · MYT</div><div class="ct">${hhmm(mn)}</div></div>
    </div>
    <div class="quick2">
      <div class="qcard" onclick="showPrayer()">
        <div class="ql"><i class="ti ti-building-mosque" style="color:var(--green)"></i> Next prayer</div>
        <div class="qv" id="qPray">—</div>
      </div>
      <div class="qcard" onclick="showCurrency()">
        <div class="ql"><i class="ti ti-currency-yen" style="color:#7a72d6"></i> ¥1,000 =</div>
        <div class="qv">${rm2(1000*fxRate())}</div>
        <div class="qs">¥1 = RM${fxRate()}${fxIsLive()?" · live":""}</div>
      </div>
    </div>`;

  $("#todayBody").innerHTML=`
    ${hi}
    ${clocks}
    ${paceToggle()}
    <div class="eyebrow">Day ${esc(next.day)} · ${esc(weekdayOf(next.date,true))} ${esc(next.date)}</div>
    <div class="stop-label now"><span class="dot"></span>YOU ARE HERE NOW</div>
    <div class="nextcard">
      <div class="loc"><i class="ti ${ico}" style="color:${col}"></i>${esc(next.location||next.activity)}</div>
      ${pill?`<div style="margin:9px 0 -2px">${pill}</div>`:""}
      <div class="time">${esc(next.time)||"—"}</div>
      <div style="font-size:15.5px;color:var(--muted);margin-bottom:2px;line-height:1.4;">${esc(next.activity)}</div>
      ${next.transit_info?`<div class="transit big"><i class="ti ti-arrow-guide"></i>${esc(next.transit_info)}</div>`:""}${notes}
      <div class="qbtns">
        <button class="qbtn" onclick="openLink('${mapsDirMode(next.lat,next.lng,next.location,nmode)}')"><i class="ti ${nmeta.icon}" style="color:var(--navy2)"></i><div>${nmeta.label}</div></button>
        <button class="qbtn" onclick="openLink('${mapsSearch("halal food near "+(next.location||""))}')"><i class="ti ti-tools-kitchen-2" style="color:#c0562f"></i><div>Halal</div></button>
        <button class="qbtn" onclick="openLink('${mapsSearch("convenience store near "+(next.location||""))}')"><i class="ti ti-building-store" style="color:#7c7b76"></i><div>Store</div></button>
      </div>
      ${nmode==="drive"?`<button class="bigbtn grey" style="margin-top:10px" onclick="openLink('${parkingNear(next.location,next.lat,next.lng)}')"><i class="ti ti-parking"></i>Nearby parking</button>`:""}
      ${doneBtn}
    </div>
    ${upnext}
    ${paceBlock(next)}

    ${remHtml}
  `;
}
// Kad kedua: tempat SELEPAS ini. Sengaja lebih kecil daripada kad "sekarang"
// supaya tak keliru mana satu yang sedang berlaku — tapi masih besar cukup
// untuk dibaca orang tua, dan maklumat kereta api tetap dipapar penuh di sini
// (itu yang orang perlu tahu SEBELUM bergerak).
function upNextCard(r){
  if(!r)return `<div class="stop-label then">THEN</div>
    <div class="upnext done"><i class="ti ti-flag-check"></i><div>That is the last stop on the list. Nothing after this.</div></div>`;
  const ico=TYPE_ICON[r.type]||"ti-map-pin",col=TYPE_COLOR[r.type]||"#185FA5";
  const tr=r.transit_info?`<div class="transit big"><i class="ti ti-arrow-guide"></i>${esc(r.transit_info)}</div>`:"";
  return `<div class="stop-label then">THEN — NEXT STOP</div>
    <div class="upnext">
      <div class="un-head">

  try{

    const t=await timingsFor(cur.lat,cur.lng,isMyRow(cur)?mytNow():jstNow());

    let diff=nx[2]-now; if(diff<0)diff+=1440;

// ====== TRANSPORT MODE (per stop; `transport` column overrides, else area default) ======
const AREA_MODE=[
  {re:/kawaguchiko|fujiyoshida|fuji-?q|yamanaka|makaino|gotemba|chureito|mishima|home in fuji/i,mode:"drive"},
  {re:/kyoto|gion|arashiyama|fushimi|higashiyama|shijo|omiya/i,mode:"taxi"},
  {re:/osaka|namba|umeda|dotonbori|shin-osaka|sakuragawa/i,mode:"train"}
];
const MODE_META={
  train:{label:"Train",icon:"ti-train",travel:"transit"},
  transit:{label:"Train",icon:"ti-train",travel:"transit"},
  drive:{label:"Drive",icon:"ti-car",travel:"driving"},
  driving:{label:"Drive",icon:"ti-car",travel:"driving"},
  taxi:{label:"Taxi",icon:"ti-car",travel:"driving"},
  walk:{label:"Walk",icon:"ti-walk",travel:"walking"},
  walking:{label:"Walk",icon:"ti-walk",travel:"walking"}
};
function stopMode(r){
  const m=String((r&&r.transport)||"").trim().toLowerCase();
  if(m&&MODE_META[m])return m;
  const loc=String((r&&(r.location||r.activity))||"");
  for(let i=0;i<AREA_MODE.length;i++){if(AREA_MODE[i].re.test(loc))return AREA_MODE[i].mode;}
  return "transit"; // default (Tokyo & umum) = train
}
function mapsDirMode(lat,lng,name,mode){
  const mm=MODE_META[mode]||MODE_META.transit;
  const dest=(lat&&lng)?(lat+","+lng):uenc(name||"");
  return "https://www.google.com/maps/dir/?api=1&destination="+dest+"&travelmode="+mm.travel;
}
function parkingNear(name,lat,lng){
  if(lat&&lng)return "https://www.google.com/maps/search/parking/@"+lat+","+lng+",16z";
  return mapsSearch("parking near "+(name||""));
}

// ====== CURRENCY (YEN <-> MYR) ======
// Kadar hidup diambil dari open.er-api.com (mid-market, sama asas dengan Wise —
// Wise tiada API awam percuma). Kalau gagal/offline, guna kadar dari tab Info.
// PENTING: kadar hidup hanya untuk belanja BARU. Baris lama kekal guna
// rate_to_rm yang disimpan masa ia direkod, supaya hutang tak berubah sendiri.
const FX_KEY="knm_fx_v1", FX_FRESH_MS=6*3600e3, FX_MAX_MS=7*24*3600e3;
let LIVE_FX=null, LIVE_FX_TS=0, CVT_FX=0.0257;
function loadFxCache(){
  try{const c=JSON.parse(localStorage.getItem(FX_KEY));
    if(c&&c.r>0&&(Date.now()-c.ts)<FX_MAX_MS){LIVE_FX=c.r;LIVE_FX_TS=c.ts;}}catch(e){}
}
async function refreshFx(force){
  if(!force&&LIVE_FX&&(Date.now()-LIVE_FX_TS)<FX_FRESH_MS)return LIVE_FX;
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/JPY",{cache:"no-store"});
    const j=await r.json();
    const v=j&&j.rates&&Number(j.rates.MYR);
    if(v>0&&v<1){ // semakan waras: ¥1 mesti jauh kurang dari RM1
      LIVE_FX=v;LIVE_FX_TS=Date.now();
      try{localStorage.setItem(FX_KEY,JSON.stringify({r:v,ts:LIVE_FX_TS}));}catch(e){}
    }
  }catch(e){}
  return LIVE_FX;
}
function sheetRate(){
  const inf=rows("Info").find(r=>/exchange|rate|tukar/i.test(String(r.key)));
  if(inf){const m=String(inf.value).match(/0?\.\d+/);if(m)return parseFloat(m[0]);}
  return 0.0257;
}
function fxRate(){return (LIVE_FX>0)?Math.round(LIVE_FX*1e6)/1e6:sheetRate();}
function fxIsLive(){return LIVE_FX>0;}
function fxAge(){
  if(!LIVE_FX_TS)return "";
  const m=Math.round((Date.now()-LIVE_FX_TS)/60000);
  if(m<60)return m+" min ago";
  const h=Math.round(m/60);return h<24?(h+" h ago"):(Math.round(h/24)+" d ago");
}
async function fxRefreshNow(){
  const el=$("#fxLine");if(el)el.innerHTML='<span class="spin"></span> Updating…';
  await refreshFx(true);
  CVT_FX=fxRate();
  const j=$("#cvJPY");if(j&&j.value)cvtJPY();
  const e2=$("#fxLine");if(e2)e2.innerHTML=fxLine();
  renderMoney();
}
function fxLine(){
  return fxIsLive()
    ? `¥1 = RM${fxRate()} · <span style="color:var(--green);font-weight:700">live</span> · updated ${esc(fxAge())}
       <button class="mini" style="display:inline-flex;flex:0 0 auto;padding:2px 9px;margin-left:6px" onclick="fxRefreshNow()">refresh</button>`
    : `¥1 = RM${fxRate()} · from the Info tab (no connection yet)
       <button class="mini" style="display:inline-flex;flex:0 0 auto;padding:2px 9px;margin-left:6px" onclick="fxRefreshNow()">get live rate</button>`;
}
function showCurrency(){
  CVT_FX=fxRate();
  $("#modalMount").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Currency converter</h3>
      <p id="fxLine">${fxLine()}</p>
      <label class="field-label">Japanese yen (¥)</label>
      <input id="cvJPY" inputmode="decimal" oninput="cvtJPY()" placeholder="0">
      <label class="field-label">Malaysian ringgit (RM)</label>
      <input id="cvMYR" inputmode="decimal" oninput="cvtMYR()" placeholder="0">
      <div style="display:flex;gap:7px;margin:2px 0 12px;flex-wrap:wrap">
        ${[1000,3000,5000,10000].map(v=>`<button class="daytab" onclick="cvtSet(${v})">¥${v.toLocaleString()}</button>`).join("")}
      </div>
      <div class="link-row" style="margin-bottom:10px" onclick="openLink('https://wise.com/gb/currency-converter/jpy-to-myr-rate')"><i class="ti ti-external-link" style="color:#0F6E56"></i><span>Compare on Wise</span><i class="ti ti-chevron-right" style="color:var(--hint)"></i></div>
      <div class="modal-row"><button class="mbtn ghost" onclick="closeModal()">Close</button></div>
    </div></div>`;
}

function cvtMYR(){const v=parseFloat($("#cvMYR").value)||0;const el=$("#cvJPY");if(el)el.value=Math.round(v/CVT_FX);}

const PRAYER_METHOD=3; // Muslim World League
function to12(hhmm){const m=String(hhmm||"").match(/(\d{1,2}):(\d{2})/);if(!m)return hhmm||"—";let h=+m[1];const mm=m[2],ap=h<12?"AM":"PM",hh=(h%12)||12;return hh+":"+mm+" "+ap;}
async function timingsFor(lat,lng,dateParts){
  const dd=String(dateParts.d).padStart(2,"0")+"-"+String(dateParts.mo+1).padStart(2,"0")+"-"+dateParts.y;
  const key="knm_pray_"+lat+"_"+lng+"_"+dd;
  let t=null;try{t=JSON.parse(localStorage.getItem(key));}catch(e){}
  if(t)return t;
  const r=await fetch("https://api.aladhan.com/v1/timings/"+dd+"?latitude="+lat+"&longitude="+lng+"&method="+PRAYER_METHOD);
  const j=await r.json();t=j.data.timings;
  try{localStorage.setItem(key,JSON.stringify(t));}catch(e){}
  return t;
}

  const j=await apiPost({action:"rosterSave",who:me,pin:pin,item:item,value:value},pin);
  if(j.ok){await refresh(false);showRoster();toast("Saved");}
  else toast(j.error||"Could not save");
}
async function rosterRemove(item){
  const me=meGet(),pin=mePin()||(ADMIN?ADMIN_PIN:"");
  if(!pin){toast("Set a personal PIN in the Members tab first");return;}
  const j=await apiPost({action:"rosterDelete",who:me,pin:pin,item:item},pin);
  if(j.ok){await refresh(false);showRoster();toast("Removed");}
  else toast(j.error||"Could not remove");
}

// ====== FLIGHTS ======
// Masa berlepas dibaca dari baris Info "Outbound" (cth "D7 522 · KUL 14:50 ->
// HND 22:40") — tukar penerbangan dalam Sheet, semua cut-off di bawah ikut
// sendiri. Tiada masa ditulis mati dalam kod.
function depTimeMin(){
  const r=rows("Info").find(x=>/^flight$/i.test(String(x.category).trim())
                              &&/^outbound$/i.test(String(x.key).trim()));
  const m=String((r&&r.value)||"").match(/KUL\s*(\d{1,2}):(\d{2})/i);
  return m?(+m[1])*60+(+m[2]):null;
}
// Cut-off KLIA2 yang orang paling kerap terlepas pandang: kaunter tutup 60

function renderTrip(){
  const it=rows("Itinerary");
  // compare days as strings: an edited row may come back "2" while others are 2
  const days=[...new Set(it.map(r=>String(r.day)))].filter(d=>d!==""&&d!=="null"&&d!=="undefined");
  if(curDay==null)curDay=days[0];
  $("#dayTabs").innerHTML=days.map(d=>{
    const dt=it.find(r=>String(r.day)===d);
    const wd=dt?weekdayOf(dt.date):"";
    return `<button class="daytab ${d===String(curDay)?'on':''}" onclick="setDay('${jsq(d)}')">Day ${esc(d)}<br><span style="font-size:10px;opacity:.8">${esc(wd?wd+" ":"")}${esc(dt?dt.date:'')}</span></button>`;
  }).join("");
  const list=it.filter(r=>String(r.day)===String(curDay));
  const activeDay=(it.find(r=>String(r.status).toLowerCase()!=="done")||{}).day;
  const paceOn=ADMIN&&tripActive()&&paceMode()==="flex"&&String(curDay)===String(activeDay);
  const pace=paceOn?dayPace(curDay):null;
  let html=paceOn?'<div class="binfo" style="margin:0 0 11px">Auto-paced for today · suggested times shift with the clock (fixed points locked).</div>':'';
  html+='<div class="tl">';
  list.forEach(r=>{
    const done=String(r.status).toLowerCase()==="done";
    const cls=(r.type==="prayer"?"prayer ":"")+(done?"done":"");
    let adjTag="";
    if(pace){const p=pace[r.id];if(p){if(p.anchor)adjTag=' <span class="adj fixed">fixed</span>';else if(p.arr!=null)adjTag=' <span class="adj'+(p.tight?' tight':'')+'">≈'+fmtMin(p.arr)+'</span>';}}
    const urgent=String(r.urgent).toUpperCase()==="YES"?' · <span style="color:var(--red)">urgent</span>':"";
    const transit=r.transit_info?`<div class="transit"><i class="ti ti-arrow-guide"></i>${esc(r.transit_info)}</div>`:"";
    const notes=r.notes?`<div class="tl-notes">${esc(r.notes)}</div>`:"";
    const rmode=stopMode(r),rmeta=MODE_META[rmode],dirUrl=mapsDirMode(r.lat,r.lng,r.location,rmode);
    const admin=ADMIN?`<div class="tl-actions">
        <button class="mini" onclick="openLink('${dirUrl}')"><i class="ti ${rmeta.icon}" style="color:var(--navy2)"></i></button>
        <button class="mini" onclick="editItin('${jsq(r.id)}')"><i class="ti ti-edit"></i></button>
        <button class="mini" onclick="confirmDel('Itinerary',${r._row},'${jsq(r.activity)}')"><i class="ti ti-trash" style="color:var(--red)"></i></button>
        <button class="mini" onclick="toggleDone('${jsq(r.id)}','${done?'':'done'}')"><i class="ti ti-check" style="color:${done?'#B4B2A9':'#0F6E56'}"></i></button>
      </div>`
      :`<div class="tl-actions"><button class="mini" onclick="openLink('${dirUrl}')"><i class="ti ${rmeta.icon}" style="color:var(--navy2)"></i> <span style="font-size:11px">${rmeta.label}</span></button>${rmode==="drive"?`<button class="mini" onclick="openLink('${parkingNear(r.location,r.lat,r.lng)}')"><i class="ti ti-parking" style="color:var(--navy2)"></i> <span style="font-size:11px">Parking</span></button>`:""}</div>`;
    html+=`<div class="tl-item ${cls}">
      <div class="tl-time">${esc(r.time)}${urgent}${adjTag}${done?' <span class="tag-done">done</span>':''}</div>
      <div class="tl-act">${esc(r.activity)}</div>
      <div class="tl-loc">${esc(r.location)}</div>
      ${transit}${notes}${admin}
    </div>`;
  });
  html+='</div>';
  if(ADMIN)html+=`<button class="bigbtn" style="background:var(--brand1);margin-top:14px" onclick="addItin()"><i class="ti ti-plus"></i>Add stop to Day ${curDay}</button>`;
  $("#tripBody").innerHTML=html;
}

// ---- Pengesahan PIN tanpa internet ----
// Masalah sebenar: kalau app auto-kunci di tempat tiada line, signIn ke server
// akan gagal dan orang itu terkunci daripada itinerary sendiri — tepat masa dia
// paling perlukan. Jadi setiap kali log masuk BERJAYA dalam talian, kita simpan
// cap jari PIN (SHA-256 + garam rawak peranti ini) supaya kali seterusnya boleh
// disahkan terus atas telefon.
//
// Jujur tentang had: PIN 4 angka memang boleh dicuba habis oleh sesiapa yang
// pandai buka localStorage. Ini pengenalan + halangan biasa, bukan kripto.
// PIN sebenar tetap tidak pernah ditulis ke storan.
const VERIF_KEY="knm_verif";
function verifGet(){try{return JSON.parse(localStorage.getItem(VERIF_KEY)||"[]");}catch(e){return [];}}
function randSalt(){
  const a=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(let i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);
  return Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function pinHash(salt,pin){
  const msg=salt+"|"+pin;
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  // Sandaran untuk pelayar lama tanpa WebCrypto — lemah, tapi lebih baik
  // daripada menyimpan PIN mentah, dan tak pernah dihantar ke mana-mana.
  let h1=0x811c9dc5,h2=0x01000193;
  for(let i=0;i<msg.length;i++){
    h1=(h1^msg.charCodeAt(i))>>>0;h1=(h1*16777619)>>>0;
    h2=(h2+msg.charCodeAt(i)*(i+7))>>>0;
  }
  return "fnv"+h1.toString(16)+h2.toString(16);
}
async function verifSave(name,pin,admin){
  try{
    const salt=randSalt();
    const rec={name:name,admin:!!admin,salt:salt,hash:await pinHash(salt,pin)};
    const list=verifGet().filter(v=>v.name!==name);
    list.push(rec);
    localStorage.setItem(VERIF_KEY,JSON.stringify(list.slice(-8)));
  }catch(e){}
}
// Pulangkan {name,admin} kalau PIN sepadan dengan sesiapa yang pernah log masuk
// atas peranti ini. Orang yang tak pernah guna telefon ni tetap tak boleh masuk.
async function verifCheck(pin){
  const list=verifGet();
  for(let i=0;i<list.length;i++){
    const v=list[i];
    if(!v||!v.salt||!v.hash)continue;
    if(await pinHash(v.salt,pin)===v.hash)return {name:v.name,admin:!!v.admin};
  }
  return null;
}

// share per person (in RM) for one expense row
function splitShares(r,names){
  const rate=Number(r.rate_to_rm)||1;
  const sw=String(r.split_with||"ALL").trim();
  const shares={};
  if(String(r.split_type).toLowerCase()==="custom"||sw.includes("=")){
    sw.split(",").forEach(p=>{
      const m=p.split("=");const n=m[0].trim();const a=parseFloat(m[1]);
      if(n&&!isNaN(a))shares[n]=(shares[n]||0)+a*rate;
    });
  }else{
    const list=(sw.toUpperCase()==="ALL"||!sw)?names:sw.split(",").map(s=>s.trim()).filter(Boolean);
    const tot=Number(r.amount_rm)||((Number(r.amount)||0)*rate);
    if(list.length)list.forEach(n=>shares[n]=(shares[n]||0)+tot/list.length);
  }
  return shares;
}
// net balance per member: + = dihutang (patut terima), − = berhutang
function balances(){
  const names=memberList();const net={};names.forEach(n=>net[n]=0);
  expensesAll().forEach(r=>{
    const totRM=Number(r.amount_rm)||((Number(r.amount)||0)*(Number(r.rate_to_rm)||1));
    const payer=String(r.paid_by||"").trim();
    if(payer&&net[payer]!=null)net[payer]+=totRM;
    const sh=splitShares(r,names);
    Object.keys(sh).forEach(n=>{if(net[n]!=null)net[n]-=sh[n];});
  });
  return net;
}
// Cadangan transfer paling sedikit (greedy).
// Dikira dalam SEN (integer) — bukan perpuluhan. Sebabnya: kalau setiap baki
// dibundarkan berasingan, jumlah hutang & piutang boleh beza satu sen, dan sen
// itu tergantung selamanya (takkan boleh settle habis). Dengan integer sen,
// jumlah keluar = jumlah masuk, tepat.
function settleSuggest(){
  const net=balances();
  const names=Object.keys(net);
  if(!names.length)return [];
  const sen={};names.forEach(n=>{sen[n]=Math.round((net[n]||0)*100);});
  // Baki pembundaran diserap oleh baki terbesar, supaya jumlahnya tepat sifar.
  let resid=names.reduce((s,n)=>s+sen[n],0);
  if(resid!==0){
    let big=names[0];
    names.forEach(n=>{if(Math.abs(sen[n])>Math.abs(sen[big]))big=n;});
    sen[big]-=resid;
  }
  const cred=[],debt=[];
  names.forEach(n=>{if(sen[n]>0)cred.push({n:n,v:sen[n]});else if(sen[n]<0)debt.push({n:n,v:-sen[n]});});
  cred.sort((a,b)=>b.v-a.v);debt.sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const amt=Math.min(debt[i].v,cred[j].v);
    if(amt>0)out.push({from:debt[i].n,to:cred[j].n,amt:amt/100});
    debt[i].v-=amt;cred[j].v-=amt;
    if(debt[i].v===0)i++;
    if(cred[j].v===0)j++;
  }
  return out;
}

// Shrink a camera photo before upload: phone originals are 3-5 MB, which is
// slow on hotel wifi and pointless for a receipt. ~1600px / q0.8 stays legible.
function compressImage(file,maxDim,quality){
  return new Promise(function(res,rej){
    const fr=new FileReader(),img=new Image();
    fr.onerror=rej;img.onerror=function(){rej(new Error("bad image"));};
    fr.onload=function(e){img.src=e.target.result;};
    img.onload=function(){
      let w=img.width,h=img.height;
      const sc=Math.min(1,maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",quality));
    };
    fr.readAsDataURL(file);
  });
}

// Read the receipt and pre-fill amount / description. Always editable afterwards.
function scanReceipt(){
  if(!EF.imgData){toast("Attach a photo first");return;}
  const st=$("#efRcptState");
  if(st)st.innerHTML='<span class="spin"></span> Reading receipt…';
  withExpPin(async function(pin){
    const j=await apiPost({action:"ocrReceipt",dataUrl:EF.imgData,lang:"auto"},pin);
    if(!j.ok){
      const err=String(j.error||"unknown error");
      // Surface the real reason: "Action tak dikenali" means the server is still
      // running the old Code.gs; a 403 means Drive access was never authorised.
      let hint="";
      if(/Action tak dikenali/i.test(err))hint=" — the server is still running the old Code.gs. Paste the latest version and redeploy.";
      else if(/\b40[13]\b|permission|scope|authoriz/i.test(err))hint=" — run the authorize() function once in the Apps Script editor, then try again.";
      showReceiptState('<span style="color:var(--amber)">Could not read it. '+esc(err)+esc(hint)+'</span>');
      if(/PIN/i.test(err)){try{localStorage.removeItem(EXPPIN_KEY);}catch(e){}}
      return;}
    const p=j.parsed||{};const got=[];
    if(p.total){
      const amt=$("#efAmt");
      if(amt&&!String(amt.value).trim()){
        if(p.currency==="MYR"&&EF.cur!=="MYR")efSetCur("MYR");
        else if(p.currency==="JPY"&&EF.cur!=="JPY")efSetCur("JPY");
        amt.value=p.total;expRecalc();
        got.push("amount "+(p.currency==="MYR"?"RM":"¥")+p.total);
      }
    }
    if(p.title){
      const t=$("#efTitle");
      if(t&&!String(t.value).trim()){t.value=p.title;got.push("description");}
    }
    showReceiptState(got.length
      ? '<span style="color:var(--green)">✓ Filled in '+got.join(" and ")+' — please check it is correct.</span>'
      : '<span style="color:var(--amber)">Nothing recognised. Please enter the details manually.</span>');
  });
}

function imgUrl(u){
  const m=String(u||"").match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([A-Za-z0-9_-]{10,})/);
  return m?("https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1000"):u;
}

async function expensePost(payload,localRec){
  let pin=ADMIN?ADMIN_PIN:expPinStored();
  if(!pin&&!CFG.expensesOpen){askExpPin(payload,localRec);return;}
  pin=pin||"";
  const j=await apiPost(payload,pin);
  if(j.ok){
    if(localRec&&DATA.Expenses){const hdrs=DATA.Expenses[0];DATA.Expenses.push(hdrs.map(h=>localRec[h]!=null?localRec[h]:""));saveCache();}
    renderMoney();toast("Expense saved");refresh(false);
  }else{
    if(/PIN/i.test(j.error||"")){try{localStorage.removeItem(EXPPIN_KEY);}catch(e){}askExpPin(payload,localRec);toast(j.error);}
    else toast(j.error||"Could not save");
  }
}

  // keep numbers as numbers (day/lat/price) or day-tab filtering and maths drift
  // after an edit; leading-zero strings (phone numbers) stay strings
  const values=flds.map(f=>{
    const el=$("#f_"+f);let v=el?el.value:"";
    const t=String(v).trim();
    if(t!==""&&/^-?(0|[1-9]\d*)(\.\d+)?$/.test(t))v=Number(t);
    return v;
  });
  closeModal();
  if(rowNum==="null"||rowNum===null||rowNum==="undefined"){await addRow(tab,values);}
  else{await updateRow(tab,Number(rowNum),values);}
}
function confirmDel(tab,rowNum,label){
  $("#modalMount").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Delete?</h3><p>${esc(label)}</p>
      <div class="modal-row">
        <button class="mbtn ghost" onclick="closeModal()">Cancel</button>
        <button class="mbtn danger" onclick="doDel('${tab}',${rowNum})">Delete</button>
      </div>
    </div></div>`;
}
async function doDel(tab,rowNum){closeModal();await deleteRow(tab,Number(rowNum));}

</script>
</body>
